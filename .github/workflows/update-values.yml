name: Aggiorna valori da pagelle

# Parte quando salvi nuove pagelle (data/pagelle.json) o a mano. Non legge nessun sito: usa solo i file del repository.
on:
  push:
    paths: ['data/pagelle.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  valori:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_values.py
      - name: Salva le modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players.json data/staff.json data/values.json
          if git diff --cached --quiet; then
            echo "Nessuna novità."
          else
            git commit -m "Aggiorna valori giocatori e staff"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
