name: Aggiorna risultati

on:
  schedule:
    - cron: '*/10 10-23 * * *'
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'          # evita errori di accenti nella console di Windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze e Chromium
        shell: powershell
        run: |
          python -m pip install -r scripts/requirements.txt
          python -m pip install "playwright>=1.45"
          python -m playwright install chromium

      - name: Serve aggiornare?
        id: decide
        shell: powershell
        run: |
          $eventName = "${{ github.event_name }}"
          $schedule = "${{ github.event.schedule }}"

          if ($eventName -eq "workflow_dispatch" -or $schedule -eq "30 4 * * *") {
            "run=true" >> $env:GITHUB_OUTPUT
          }
          else {
            $shouldRun = python scripts/update_matches.py --should-run

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            "run=$($shouldRun.Trim())" >> $env:GITHUB_OUTPUT
          }

      - name: Leggi i risultati (giornata attuale + successiva)
        if: steps.decide.outputs.run == 'true'
        shell: powershell
        run: |
          python scripts/update_matches.py --mode browser --hidden --smart

      - name: Aggiorna valori e file per il foglio Google
        if: steps.decide.outputs.run == 'true'
        shell: powershell
        run: |
          python scripts/update_values.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/export_sheet_data.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Salva le modifiche
        if: steps.decide.outputs.run == 'true'
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/matches.json data/live.json data/players.json data/staff.json data/values.json data/foglio-rosa.csv data/foglio-partite.csv

          if (git diff --cached --quiet) {
            Write-Host "Nessuna novità."
          }
          else {
            git commit -m "Aggiorna risultati"
            git pull --rebase origin $env:GITHUB_REF_NAME

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            git push origin HEAD:$env:GITHUB_REF_NAME
          }

      - name: Pagine di debug (solo se qualcosa non è stato letto)
        if: always() && steps.decide.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-pagine
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
