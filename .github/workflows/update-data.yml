name: Aggiorna risultati

on:
  schedule:
    - cron: '*/10 10-23 * * *'   # ogni 10 minuti, ma lo script si ferma subito se non c'è una partita vicina
    - cron: '30 4 * * *'         # una volta al giorno rilegge tutte le giornate (date e orari cambiano)
  workflow_dispatch:             # avvio manuale dal tab Actions: fa sempre il giro completo

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Serve aggiornare?
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "30 4 * * *" ]; then
            echo "run=true"  >> "$GITHUB_OUTPUT"
            echo "full=--full" >> "$GITHUB_OUTPUT"
          else
            echo "run=$(python scripts/update_matches.py --should-run)" >> "$GITHUB_OUTPUT"
            echo "full=" >> "$GITHUB_OUTPUT"
          fi

      - name: Installa dipendenze
        if: steps.decide.outputs.run == 'true'
        run: |
          pip install -r scripts/requirements.txt
          playwright install --with-deps chromium

      - name: Leggi i risultati
        if: steps.decide.outputs.run == 'true'
        run: python scripts/update_matches.py ${{ steps.decide.outputs.full }}

      - name: Salva le modifiche
        if: steps.decide.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json data/live.json
          if git diff --cached --quiet; then
            echo "Nessuna novità."
          else
            git commit -m "Aggiorna risultati"
            git pull --rebase
            git push
          fi
