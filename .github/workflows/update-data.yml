name: Aggiorna risultati

on:
  schedule:
    - cron: '*/10 10-23 * * *'   # ogni 10 minuti, ma si ferma subito se non c'è una partita vicina
    - cron: '30 4 * * *'         # una volta al giorno: aggiorna comunque (date e orari possono cambiare)
  workflow_dispatch:             # avvio manuale dal tab Actions: aggiorna sempre

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Serve aggiornare?
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "30 4 * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=$(python scripts/update_matches.py --should-run)" >> "$GITHUB_OUTPUT"
          fi

      - name: Installa dipendenze
        if: steps.decide.outputs.run == 'true'
        run: |
          pip install -r scripts/requirements.txt
          playwright install --with-deps chromium

      - name: Leggi i risultati (giornate 1-22)
        if: steps.decide.outputs.run == 'true'
        run: python scripts/update_matches.py

      - name: Salva le modifiche
        if: steps.decide.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json data/live.json
          if git diff --cached --quiet; then
            echo "Nessuna novità."
          else
            git commit -m "Aggiorna risultati"
            git pull --rebase
            git push
          fi

      - name: Pagine di debug (solo se qualcosa non è stato letto)
        if: always() && steps.decide.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-pagine
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
