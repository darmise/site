<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Home</title>
  <meta name="description" content="Il blog dei tifosi: pagelle, risultati in diretta e tutto sulla rosa.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body data-page="home">
  <header class="site-header" id="site-header"></header>

  <main id="app">
    <div class="wrap">
      <!-- 1. Chi siamo  |  2. Obiettivo del sito -->
      <section class="section">
        <div class="grid g2 even">
          <div>
            <div class="section-head"><h2>Chi siamo</h2></div>
            <div class="card about">
              <p id="about-text"></p>
              <aside class="fun-note" id="fun-note" role="note"></aside>
            </div>
          </div>
          <div>
            <div class="section-head"><h2>Obiettivo del sito</h2></div>
            <div class="card about">
              <p id="goal-text"></p>
              <ul class="goal-list" id="goal-list"></ul>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- 3. Ultimo risultato (oppure diretta, se la partita è in corso) -->
    <section class="hero band" aria-label="Ultimo risultato">
      <div class="wrap" id="hero-content"></div>
    </section>

    <div class="wrap">
      <!-- 4. Prossima gara -->
      <section class="section">
        <div class="section-head"><h2>Prossima gara</h2></div>
        <div class="card next next-card" id="next-match"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/app.js?v=5"></script>
  <script src="js/mascot.js?v=3"></script>
</body>
</html>
